<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16324f">
  <meta name="description" content="Danh mục công cụ NTCONS & ứng dụng xây dựng: Be BTCT, Cầu kiện 3D, Thư viện VBPL và nhiều demo kỹ thuật.">
  <title>NTCONS — Ứng dụng Xây dựng</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #16202a;
      --muted: #637080;
      --paper: #f4f7f9;
      --surface: #ffffff;
      --line: #d9e1e7;
      --navy: #16324f;
      --blue: #176b87;
      --soft-blue: #eaf4f7;
      --green: #18735c;
      --shadow: 0 12px 30px rgba(22, 50, 79, 0.09);
    }

    * { box-sizing: border-box; }

    html { text-size-adjust: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink);
      background:
        radial-gradient(circle at top right, rgba(23, 107, 135, 0.12), transparent 34rem),
        var(--paper);
    }

    button, input { font: inherit; }

    .shell {
      width: min(980px, calc(100% - 32px));
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(48px, env(safe-area-inset-bottom));
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 20px;
      align-items: end;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(2rem, 7vw, 4.2rem);
      line-height: 0.95;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 620px;
      margin: 14px 0 0;
      color: var(--muted);
      line-height: 1.55;
    }

    .count {
      min-width: 112px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.76);
      text-align: center;
      box-shadow: var(--shadow);
    }

    .count strong {
      display: block;
      color: var(--navy);
      font-size: 1.8rem;
      line-height: 1;
    }

    .count span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-bottom: 18px;
    }

    .search-wrap { position: relative; }

    .search-wrap span {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    #search {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 44px;
      border: 1px solid var(--line);
      border-radius: 14px;
      outline: none;
      background: var(--surface);
      color: var(--ink);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    #search:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 4px rgba(23, 107, 135, 0.12);
    }

    .refresh {
      min-height: 48px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--surface);
      color: var(--navy);
      cursor: pointer;
      font-weight: 750;
    }

    .refresh:hover { border-color: var(--blue); }
    .refresh:disabled { cursor: wait; opacity: 0.65; }

    .status {
      margin: 0 0 14px;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      min-width: 0;
      flex-direction: column;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 19px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      gap: 13px;
      align-items: flex-start;
    }

    .file-mark {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 12px;
      background: var(--soft-blue);
      color: var(--blue);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.04em;
    }

    .card h2 {
      margin: 1px 0 5px;
      color: var(--navy);
      font-size: 1.06rem;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .path {
      margin: 0;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.73rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 9px;
      margin-top: 19px;
    }

    .open, .copy {
      display: inline-flex;
      min-height: 43px;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      font-weight: 800;
      text-decoration: none;
    }

    .open {
      padding: 0 16px;
      border: 1px solid var(--navy);
      background: var(--navy);
      color: #fff;
    }

    .open:hover { background: var(--blue); border-color: var(--blue); }

    .copy {
      padding: 0 13px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--navy);
      cursor: pointer;
    }

    .copy:hover { border-color: var(--blue); }

    .panel {
      grid-column: 1 / -1;
      padding: 28px 22px;
      border: 1px dashed #b8c6d1;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.58);
      color: var(--muted);
      text-align: center;
      line-height: 1.55;
    }

    .panel strong { color: var(--navy); }
    .panel a { color: var(--blue); font-weight: 700; }

    .toast {
      position: fixed;
      right: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      z-index: 5;
      max-width: calc(100% - 36px);
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--green);
      color: #fff;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.2);
      font-size: 0.9rem;
      font-weight: 700;
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .toast.show { opacity: 1; transform: translateY(0); }

    footer {
      margin-top: 26px;
      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    @media (max-width: 680px) {
      .shell { width: min(100% - 22px, 980px); padding-top: 22px; }
      header { grid-template-columns: 1fr; align-items: start; }
      .count { display: flex; width: fit-content; align-items: baseline; gap: 7px; text-align: left; }
      .count strong, .count span { display: inline; margin: 0; }
      .toolbar, .grid { grid-template-columns: 1fr; }
      .refresh { width: 100%; }
      .card { padding: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">Kho công cụ trực tuyến</p>
        <h1>NTCONS</h1>
        <p class="intro">Danh mục ứng dụng xây dựng & demo kỹ thuật. Bấm <strong>Mở link</strong> để dùng trực tiếp — không cần tự ghép đường dẫn.</p>
      </div>
      <div class="count" aria-live="polite">
        <strong id="count">0</strong>
        <span>công cụ</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Tìm kiếm công cụ">
      <label class="search-wrap">
        <span aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="Tìm theo tên file…" autocomplete="off">
      </label>
      <button class="refresh" id="refresh" type="button">Làm mới danh sách</button>
    </section>

    <p class="status" id="status" aria-live="polite">Đang đọc danh sách công cụ…</p>
    <section class="grid" id="grid" aria-live="polite"></section>

    <footer>NTCONS · Ứng dụng Xây dựng · Deploy trên Vercel</footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite">Đã sao chép đường dẫn</div>

  <script>
    "use strict";

    const CONFIG = Object.freeze({
      owner: "xaydungnguyenthuc-hub",
      repo: "ungdungxaydung",
      branch: "main",
      pagesBase: "https://ungdungxaydung.vercel.app/"
    });

    const grid = document.querySelector("#grid");
    const statusText = document.querySelector("#status");
    const countText = document.querySelector("#count");
    const searchInput = document.querySelector("#search");
    const refreshButton = document.querySelector("#refresh");
    const toast = document.querySelector("#toast");
    let files = [];
    let toastTimer;

    function pageUrl(path) {
      const encodedPath = path.split("/").map(encodeURIComponent).join("/");
      return CONFIG.pagesBase + encodedPath;
    }

    function displayName(path) {
      const filename = path.split("/").pop().replace(/\.html?$/i, "");
      const titles = {
        "Be BTCT": "Be BTCT — Bê tông cốt thép",
        "Boi Bai": "Bói Bài — Tarot / Bói bài",
        "Cau Kien 3D": "Cầu kiện 3D",
        "Dac Tinh Tiet Dien": "Đặc tính tiết diện",
        "Lich am Duong": "Lịch Âm Dương",
        "NTCONS": "NTCONS — Liên minh chuyên gia",
        "Thang Long": "Thang Long — Thép 3D",
        "Tinh Gio 2737 2023-Sxcad": "Tính gió 2737 / 2023 (Sxcad)",
        "WindNTcons-main": "Wind NTCONS — Tính gió",
        "camnanquanlydtxd-main": "Cẩm nang Quản lý ĐTXD",
        "chondamxoan-giocotsanmong-main": "Chọn dầm xoắn · Giỏ cốt sàn móng",
        "quytrinhquyhoachcapxa-main": "Quy trình Quy hoạch cấp xã",
        "renderkientruc-main": "Render Kiến trúc",
        "thuvienvbpl-main": "Thư viện VBPL"
      };
      if (titles[filename]) return titles[filename];
      const cleaned = filename
        .replace(/-main$/i, "")
        .replace(/[_-]+/g, " ")
        .replace(/\s+/g, " ")
        .trim();
      return cleaned ? cleaned.charAt(0).toUpperCase() + cleaned.slice(1) : filename;
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add("show");
      toastTimer = setTimeout(() => toast.classList.remove("show"), 1800);
    }

    async function copyText(value) {
      try {
        await navigator.clipboard.writeText(value);
      } catch {
        const input = document.createElement("textarea");
        input.value = value;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.append(input);
        input.select();
        document.execCommand("copy");
        input.remove();
      }
      showToast("Đã sao chép đường dẫn");
    }

    function createCard(file) {
      const card = document.createElement("article");
      card.className = "card";

      const top = document.createElement("div");
      top.className = "card-top";

      const mark = document.createElement("div");
      mark.className = "file-mark";
      mark.textContent = "HTML";
      mark.setAttribute("aria-hidden", "true");

      const details = document.createElement("div");
      const title = document.createElement("h2");
      title.textContent = displayName(file.path);
      const path = document.createElement("p");
      path.className = "path";
      path.textContent = file.path;
      details.append(title, path);
      top.append(mark, details);

      const actions = document.createElement("div");
      actions.className = "actions";
      const url = pageUrl(file.path);

      const open = document.createElement("a");
      open.className = "open";
      open.href = url;
      open.target = "_blank";
      open.rel = "noopener noreferrer";
      open.textContent = "Mở link";
      open.setAttribute("aria-label", `Mở link ${displayName(file.path)}`);

      const copy = document.createElement("button");
      copy.className = "copy";
      copy.type = "button";
      copy.textContent = "Sao chép link";
      copy.addEventListener("click", () => copyText(url));

      actions.append(open, copy);
      card.append(top, actions);
      return card;
    }

    function showPanel(message, link) {
      const panel = document.createElement("div");
      panel.className = "panel";
      const strong = document.createElement("strong");
      strong.textContent = message;
      panel.append(strong);
      if (link) {
        const suffix = document.createElement("div");
        suffix.append(" ", link);
        panel.append(suffix);
      }
      grid.replaceChildren(panel);
    }

    function render() {
      const term = searchInput.value.trim().toLocaleLowerCase("vi");
      const visible = files.filter(file => file.path.toLocaleLowerCase("vi").includes(term));
      countText.textContent = String(files.length);
      statusText.textContent = term
        ? `Tìm thấy ${visible.length} trong ${files.length} công cụ.`
        : `${files.length} công cụ sẵn sàng sử dụng.`;

      if (!visible.length) {
        showPanel(term ? "Không tìm thấy tên file phù hợp." : "Chưa có file HTML công cụ nào.");
        return;
      }
      grid.replaceChildren(...visible.map(createCard));
    }

    // Danh sách tĩnh — luôn hoạt động dù GitHub API lỗi
    const FALLBACK_FILES = [
      "Be BTCT.html",
      "Boi Bai.html",
      "Cau Kien 3D.html",
      "Dac Tinh Tiet Dien.html",
      "Lich am Duong.html",
      "NTCONS.html",
      "Thang Long.html",
      "Tinh Gio 2737 2023-Sxcad.html",
      "WindNTcons-main.html",
      "camnanquanlydtxd-main.html",
      "chondamxoan-giocotsanmong-main.html",
      "quytrinhquyhoachcapxa-main.html",
      "renderkientruc-main.html",
      "thuvienvbpl-main.html"
    ].map(path => ({ path, type: "blob" }));

    async function loadFiles() {
      refreshButton.disabled = true;
      refreshButton.textContent = "Đang làm mới…";
      statusText.textContent = "Đang đọc danh sách công cụ…";
      showPanel("Đang tải danh sách…");

      const api = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${encodeURIComponent(CONFIG.branch)}?recursive=1`;

      try {
        const response = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
        if (!response.ok) throw new Error(`GitHub API trả về mã ${response.status}`);
        const data = await response.json();
        if (!Array.isArray(data.tree)) throw new Error("Không nhận được danh sách file.");

        files = data.tree
          .filter(item => item.type === "blob" && /\.html?$/i.test(item.path))
          .filter(item => item.path.toLocaleLowerCase("en") !== "index.html")
          .sort((a, b) => a.path.localeCompare(b.path, "vi", { numeric: true }));

        if (!files.length) throw new Error("Danh sách rỗng");
        render();
      } catch (error) {
        console.warn("GitHub API không dùng được, dùng danh sách tĩnh:", error);
        files = FALLBACK_FILES.slice().sort((a, b) => a.path.localeCompare(b.path, "vi", { numeric: true }));
        statusText.textContent = `${files.length} công cụ (danh sách nội bộ).`;
        render();
      } finally {
        refreshButton.disabled = false;
        refreshButton.textContent = "Làm mới danh sách";
      }
    }

    searchInput.addEventListener("input", render);
    refreshButton.addEventListener("click", loadFiles);
    loadFiles();
  </script>
</body>
</html>
